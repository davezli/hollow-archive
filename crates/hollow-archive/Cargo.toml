[package]
name = "hollow-archive"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zenless Zone Zero inventory exporter (packet capture) for Zenless Optimizer"

[dependencies]
hollow-proto = { path = "../hollow-proto" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.32"
egui_extras = { version = "0.32", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
egui_material_icons = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
chrono = "0.4"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"

pcap = { version = "2", optional = true }

[features]
default = []
pcap = ["dep:pcap"]

[target.'cfg(windows)'.dependencies]
pktmon = "0.6"
windows = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1"
