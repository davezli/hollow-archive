name: ci
on: [push, pull_request]
jobs:
  proto-linux:
    # The UI crate is Windows-only (eframe built without x11/wayland); Linux checks the decoder.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p hollow-proto --all-targets -- -D warnings
      - run: cargo test -p hollow-proto
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p hollow-archive
      - uses: actions/upload-artifact@v4
        with:
          name: hollow-archive-windows
          path: target/release/hollow-archive.exe
